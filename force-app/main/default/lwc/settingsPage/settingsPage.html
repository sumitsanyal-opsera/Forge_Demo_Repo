<template>
    <!-- Permission denied -->
    <template if:true={hasPermissionError}>
        <div class="slds-notify slds-notify_alert slds-alert_error" role="alert" aria-live="assertive">
            <span class="slds-assistive-text">Error</span>
            <lightning-icon icon-name="utility:lock" alternative-text="Access denied"
                variant="inverse" size="x-small" class="slds-m-right_x-small">
            </lightning-icon>
            <span>You need the <strong>SmokeTest_Admin</strong> permission set to manage settings.
                Contact your Salesforce Administrator.</span>
        </div>
    </template>

    <template if:false={hasPermissionError}>
        <!-- Breadcrumb -->
        <nav aria-label="Breadcrumb" class="slds-m-bottom_small">
            <ol class="slds-breadcrumb slds-list_horizontal slds-wrap">
                <li class="slds-breadcrumb__item">
                    <span class="slds-text-body_small slds-text-color_weak">Smoke Test Center</span>
                </li>
                <li class="slds-breadcrumb__item slds-text-body_small">Settings</li>
            </ol>
        </nav>

        <!-- Wire error -->
        <template if:true={hasWireError}>
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small"
                 role="alert" aria-live="assertive">
                <lightning-icon icon-name="utility:error" alternative-text="Error"
                    variant="inverse" size="x-small" class="slds-m-right_x-small">
                </lightning-icon>
                <span>{wireErrorMessage}</span>
            </div>
        </template>

        <!-- Page loading spinner -->
        <template if:true={isLoading}>
            <div class="slds-spinner_container" aria-live="polite">
                <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                    <span class="slds-assistive-text">Saving settings...</span>
                    <div class="slds-spinner__dot-a"></div>
                    <div class="slds-spinner__dot-b"></div>
                </div>
            </div>
        </template>

        <!-- ================================================================ -->
        <!-- Execution Settings Card                                           -->
        <!-- ================================================================ -->
        <div class="slds-card slds-m-bottom_medium settings-card">
            <div class="slds-card__header">
                <h2 class="slds-card__header-title slds-text-heading_small">
                    <lightning-icon icon-name="utility:clock" size="x-small"
                        class="slds-m-right_x-small" aria-hidden="true">
                    </lightning-icon>
                    Execution Settings
                </h2>
            </div>
            <div class="slds-card__body slds-card__body_inner">
                <div class="slds-grid slds-gutters slds-wrap">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-m-bottom_small">
                        <lightning-input
                            type="number"
                            label="Suite Timeout (seconds)"
                            data-field="SuiteTimeoutSec__c"
                            value={suiteTimeoutSec}
                            onchange={handleNumberChange}
                            min="60" max="600" step="1"
                            field-level-help="Maximum time for the full suite. Default: 300. Range: 60–600."
                            aria-valuemin="60" aria-valuemax="600"
                            aria-describedby="error-SuiteTimeoutSec">
                        </lightning-input>
                        <template if:true={suiteTimeoutError}>
                            <p id="error-SuiteTimeoutSec" class="field-error" role="alert">{suiteTimeoutError}</p>
                        </template>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-m-bottom_small">
                        <lightning-input
                            type="number"
                            label="Scenario Timeout (seconds)"
                            data-field="PerScenarioTimeoutSec__c"
                            value={scenarioTimeoutSec}
                            onchange={handleNumberChange}
                            min="10" max="120" step="1"
                            field-level-help="Per-scenario timeout. Default: 30. Range: 10–120."
                            aria-valuemin="10" aria-valuemax="120"
                            aria-describedby="error-PerScenarioTimeoutSec">
                        </lightning-input>
                        <template if:true={scenarioTimeoutError}>
                            <p id="error-PerScenarioTimeoutSec" class="field-error" role="alert">{scenarioTimeoutError}</p>
                        </template>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-m-bottom_small">
                        <lightning-input
                            type="number"
                            label="CPU Budget (ms)"
                            data-field="GovernorBudgetCPUMs__c"
                            value={cpuBudgetMs}
                            onchange={handleNumberChange}
                            min="1000" max="10000" step="100"
                            field-level-help="Max CPU time per scenario. Default: 5000. Range: 1000–10000."
                            aria-valuemin="1000" aria-valuemax="10000"
                            aria-describedby="error-GovernorBudgetCPUMs">
                        </lightning-input>
                        <template if:true={cpuBudgetError}>
                            <p id="error-GovernorBudgetCPUMs" class="field-error" role="alert">{cpuBudgetError}</p>
                        </template>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-m-bottom_small">
                        <lightning-input
                            type="number"
                            label="SOQL Budget"
                            data-field="GovernorBudgetSOQL__c"
                            value={soqlBudget}
                            onchange={handleNumberChange}
                            min="10" max="200" step="1"
                            field-level-help="Max SOQL queries per scenario. Default: 50. Range: 10–200."
                            aria-valuemin="10" aria-valuemax="200"
                            aria-describedby="error-GovernorBudgetSOQL">
                        </lightning-input>
                        <template if:true={soqlBudgetError}>
                            <p id="error-GovernorBudgetSOQL" class="field-error" role="alert">{soqlBudgetError}</p>
                        </template>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-m-bottom_small">
                        <lightning-input
                            type="number"
                            label="DML Budget"
                            data-field="GovernorBudgetDML__c"
                            value={dmlBudget}
                            onchange={handleNumberChange}
                            min="10" max="150" step="1"
                            field-level-help="Max DML statements per scenario. Default: 50. Range: 10–150."
                            aria-valuemin="10" aria-valuemax="150"
                            aria-describedby="error-GovernorBudgetDML">
                        </lightning-input>
                        <template if:true={dmlBudgetError}>
                            <p id="error-GovernorBudgetDML" class="field-error" role="alert">{dmlBudgetError}</p>
                        </template>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-m-bottom_small">
                        <lightning-input
                            type="number"
                            label="Circuit Breaker Threshold"
                            data-field="CircuitBreakerThreshold__c"
                            value={circuitBreakerThreshold}
                            onchange={handleNumberChange}
                            min="1" max="10" step="1"
                            field-level-help="Consecutive failures before pausing execution. Default: 3. Range: 1–10."
                            aria-valuemin="1" aria-valuemax="10"
                            aria-describedby="error-CircuitBreakerThreshold">
                        </lightning-input>
                        <template if:true={circuitBreakerError}>
                            <p id="error-CircuitBreakerThreshold" class="field-error" role="alert">{circuitBreakerError}</p>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================================================================ -->
        <!-- Security Health Check Card                                        -->
        <!-- ================================================================ -->
        <div class="slds-card slds-m-bottom_medium settings-card">
            <div class="slds-card__header">
                <h2 class="slds-card__header-title slds-text-heading_small">
                    <lightning-icon icon-name="utility:shield" size="x-small"
                        class="slds-m-right_x-small" aria-hidden="true">
                    </lightning-icon>
                    Security Health Check
                </h2>
            </div>
            <div class="slds-card__body slds-card__body_inner">
                <div class="slds-grid slds-gutters slds-wrap">
                    <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                        <lightning-input
                            type="toggle"
                            label="Enable Security Health Check"
                            data-field="SecurityHealthCheckEnabled__c"
                            checked={securityEnabled}
                            onchange={handleToggleChange}
                            message-toggle-active="Enabled"
                            message-toggle-inactive="Disabled"
                            aria-label="Toggle security health check validation">
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                        <lightning-input
                            type="number"
                            label="Minimum Score Threshold"
                            data-field="SecurityScoreAbsoluteThreshold__c"
                            value={securityMinThreshold}
                            onchange={handleNumberChange}
                            min="0" max="100" step="1"
                            field-level-help="Post-deploy security score must meet or exceed this value. Default: 80. Range: 0–100."
                            aria-valuemin="0" aria-valuemax="100"
                            aria-describedby="error-SecurityScoreAbsoluteThreshold">
                        </lightning-input>
                        <template if:true={securityMinThresholdError}>
                            <p id="error-SecurityScoreAbsoluteThreshold" class="field-error" role="alert">{securityMinThresholdError}</p>
                        </template>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                        <lightning-input
                            type="number"
                            label="Maximum Score Drop"
                            data-field="SecurityScoreRelativeThreshold__c"
                            value={securityMaxDrop}
                            onchange={handleNumberChange}
                            min="0" max="50" step="1"
                            field-level-help="Maximum allowed score decrease from pre-deployment baseline. Default: 5. Range: 0–50."
                            aria-valuemin="0" aria-valuemax="50"
                            aria-describedby="error-SecurityScoreRelativeThreshold">
                        </lightning-input>
                        <template if:true={securityMaxDropError}>
                            <p id="error-SecurityScoreRelativeThreshold" class="field-error" role="alert">{securityMaxDropError}</p>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================================================================ -->
        <!-- Rollback Policy Card                                              -->
        <!-- ================================================================ -->
        <div class="slds-card slds-m-bottom_medium settings-card">
            <div class="slds-card__header">
                <h2 class="slds-card__header-title slds-text-heading_small">
                    <lightning-icon icon-name="utility:undo" size="x-small"
                        class="slds-m-right_x-small" aria-hidden="true">
                    </lightning-icon>
                    Rollback Policy
                </h2>
            </div>
            <div class="slds-card__body slds-card__body_inner">
                <fieldset class="slds-form-element">
                    <legend class="slds-form-element__legend slds-form-element__label">
                        Default Rollback Policy
                    </legend>
                    <div class="slds-form-element__control">
                        <lightning-radio-group
                            name="rollbackPolicy"
                            label="Default Rollback Policy"
                            variant="label-hidden"
                            options={rollbackOptions}
                            value={rollbackPolicy}
                            onchange={handleRollbackPolicyChange}
                            aria-describedby="error-rollbackPolicy">
                        </lightning-radio-group>
                        <template if:true={rollbackPolicyError}>
                            <p id="error-rollbackPolicy" class="field-error" role="alert">{rollbackPolicyError}</p>
                        </template>
                    </div>
                </fieldset>
                <div class="slds-m-top_medium">
                    <lightning-input
                        type="toggle"
                        label="Dry-Run Mode"
                        data-field="DryRunMode__c"
                        checked={dryRunMode}
                        onchange={handleToggleChange}
                        message-toggle-active="Enabled — no rollback actions taken"
                        message-toggle-inactive="Disabled"
                        field-level-help="When enabled, rollback recommendations are computed but no action is taken."
                        aria-label="Toggle dry-run mode for rollback policy">
                    </lightning-input>
                </div>
            </div>
        </div>

        <!-- ================================================================ -->
        <!-- Execution Mode Card                                               -->
        <!-- ================================================================ -->
        <div class="slds-card slds-m-bottom_medium settings-card">
            <div class="slds-card__header">
                <h2 class="slds-card__header-title slds-text-heading_small">
                    <lightning-icon icon-name="utility:connected_apps" size="x-small"
                        class="slds-m-right_x-small" aria-hidden="true">
                    </lightning-icon>
                    Execution Mode
                </h2>
            </div>
            <div class="slds-card__body slds-card__body_inner">
                <div class="slds-m-bottom_medium">
                    <lightning-input
                        type="toggle"
                        label="Shadow Mode"
                        data-field="ShadowMode__c"
                        checked={shadowMode}
                        onchange={handleToggleChange}
                        message-toggle-active="Active — smoke tests run but do not block pipeline"
                        message-toggle-inactive="Inactive — smoke test results are gating"
                        field-level-help="Shadow mode allows smoke tests to run without blocking the deployment pipeline."
                        aria-label="Toggle shadow mode execution">
                    </lightning-input>
                </div>
                <div>
                    <lightning-input
                        type="toggle"
                        label="Auto-Trigger on Deployment"
                        data-field="AutoTriggerEnabled__c"
                        checked={autoTrigger}
                        onchange={handleToggleChange}
                        message-toggle-active="Enabled — DeploymentComplete__e event auto-starts smoke tests"
                        message-toggle-inactive="Disabled — smoke tests must be triggered manually"
                        field-level-help="Controls whether the DeploymentComplete__e platform event automatically starts smoke test execution."
                        aria-label="Toggle auto-trigger on deployment event">
                    </lightning-input>
                </div>
            </div>
        </div>

        <!-- ================================================================ -->
        <!-- Data Retention Card                                               -->
        <!-- ================================================================ -->
        <div class="slds-card slds-m-bottom_large settings-card">
            <div class="slds-card__header">
                <h2 class="slds-card__header-title slds-text-heading_small">
                    <lightning-icon icon-name="utility:record" size="x-small"
                        class="slds-m-right_x-small" aria-hidden="true">
                    </lightning-icon>
                    Data Retention
                </h2>
            </div>
            <div class="slds-card__body slds-card__body_inner">
                <div class="slds-grid slds-gutters slds-wrap">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_small">
                        <lightning-input
                            type="number"
                            label="Detail Logs (days)"
                            data-field="DataRetentionDaysInternal__c"
                            value={retentionDetailLogs}
                            onchange={handleNumberChange}
                            min="1" max="3650" step="1"
                            field-level-help="Retention for SmokeTestResult__c records. Default: 90."
                            aria-valuemin="1" aria-valuemax="3650"
                            aria-describedby="error-DataRetentionDaysInternal">
                        </lightning-input>
                        <template if:true={retentionDetailLogsError}>
                            <p id="error-DataRetentionDaysInternal" class="field-error" role="alert">{retentionDetailLogsError}</p>
                        </template>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_small">
                        <lightning-input
                            type="number"
                            label="Result Summaries (days)"
                            data-field="DataRetentionDaysConfidential__c"
                            value={retentionResultSummaries}
                            onchange={handleNumberChange}
                            min="1" max="3650" step="1"
                            field-level-help="Retention for SmokeTestExecution__c records. Default: 365."
                            aria-valuemin="1" aria-valuemax="3650"
                            aria-describedby="error-DataRetentionDaysConfidential">
                        </lightning-input>
                        <template if:true={retentionSummariesError}>
                            <p id="error-DataRetentionDaysConfidential" class="field-error" role="alert">{retentionSummariesError}</p>
                        </template>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_small">
                        <lightning-input
                            type="number"
                            label="Security Scores (days)"
                            data-field="DataRetentionDaysSecurityScores__c"
                            value={retentionSecurityScores}
                            onchange={handleNumberChange}
                            min="1" max="3650" step="1"
                            field-level-help="Retention for SmokeTestSecurityScore__c records. Default: 365."
                            aria-valuemin="1" aria-valuemax="3650"
                            aria-describedby="error-DataRetentionDaysSecurityScores">
                        </lightning-input>
                        <template if:true={retentionScoresError}>
                            <p id="error-DataRetentionDaysSecurityScores" class="field-error" role="alert">{retentionScoresError}</p>
                        </template>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_small">
                        <lightning-input
                            type="number"
                            label="Audit Logs (days)"
                            data-field="DataRetentionDaysAuditLogs__c"
                            value={retentionAuditLogs}
                            onchange={handleNumberChange}
                            min="365" max="3650" step="1"
                            field-level-help="Minimum 365 days required per SOC 2/ISO 27001. Default: 365."
                            aria-valuemin="365" aria-valuemax="3650"
                            aria-describedby="error-DataRetentionDaysAuditLogs">
                        </lightning-input>
                        <template if:true={auditLogRetentionInvalid}>
                            <p id="error-DataRetentionDaysAuditLogs"
                               class="field-error compliance-warning" role="alert">
                                Minimum 365 days required for SOC 2 / ISO 27001 compliance
                            </p>
                        </template>
                        <template if:true={retentionAuditLogsError}>
                            <p id="error-DataRetentionDaysAuditLogs" class="field-error" role="alert">{retentionAuditLogsError}</p>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <!-- StickyFooterSaveBar -->
        <c-sticky-footer-save-bar
            has-changes={hasChanges}
            is-saving={isLoading}
            onsave={handleSave}
            ondiscard={handleDiscard}>
        </c-sticky-footer-save-bar>

        <!-- Change Reason Modal (rollback policy) -->
        <template if:true={showChangeReasonModal}>
            <c-change-reason-modal
                header-label="Rollback Policy Change"
                body-text="Changing the rollback policy is a high-impact action. Please provide a mandatory change reason for the audit log."
                onconfirm={handleChangeReasonConfirm}
                oncancel={handleChangeReasonCancel}>
            </c-change-reason-modal>
        </template>

    </template>
</template>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="Sample Smoke Test Center dashboard with pass rate metrics and trend chart">
  <!-- Background -->
  <rect width="440" height="220" fill="#f4f6f9" rx="6"/>
  <!-- Header -->
  <rect width="440" height="44" fill="#0176d3" rx="6"/>
  <rect x="0" y="36" width="440" height="8" fill="#0176d3"/>
  <circle cx="22" cy="22" r="12" fill="#ffffff" fill-opacity="0.25"/>
  <text x="44" y="27" fill="white" font-size="13" font-weight="600" font-family="Arial,sans-serif">Smoke Test Center</text>
  <rect x="360" y="12" width="64" height="20" rx="3" fill="#ffffff" fill-opacity="0.15"/>
  <text x="392" y="26" fill="white" font-size="10" font-family="Arial,sans-serif" text-anchor="middle">Run Test</text>
  <!-- Metric cards row -->
  <rect x="12" y="54" width="96" height="56" rx="4" fill="white"/>
  <text x="60" y="76" fill="#3ba755" font-size="20" font-weight="700" font-family="Arial,sans-serif" text-anchor="middle">96%</text>
  <text x="60" y="93" fill="#706e6b" font-size="9" font-family="Arial,sans-serif" text-anchor="middle">Pass Rate</text>
  <rect x="116" y="54" width="96" height="56" rx="4" fill="white"/>
  <text x="164" y="76" fill="#0176d3" font-size="20" font-weight="700" font-family="Arial,sans-serif" text-anchor="middle">247</text>
  <text x="164" y="93" fill="#706e6b" font-size="9" font-family="Arial,sans-serif" text-anchor="middle">Executions</text>
  <rect x="220" y="54" width="96" height="56" rx="4" fill="white"/>
  <text x="268" y="76" fill="#dd7a01" font-size="20" font-weight="700" font-family="Arial,sans-serif" text-anchor="middle">12</text>
  <text x="268" y="93" fill="#706e6b" font-size="9" font-family="Arial,sans-serif" text-anchor="middle">Scenarios</text>
  <rect x="324" y="54" width="104" height="56" rx="4" fill="white"/>
  <text x="376" y="76" fill="#c23934" font-size="20" font-weight="700" font-family="Arial,sans-serif" text-anchor="middle">2.3s</text>
  <text x="376" y="93" fill="#706e6b" font-size="9" font-family="Arial,sans-serif" text-anchor="middle">Avg Duration</text>
  <!-- Trend chart card -->
  <rect x="12" y="118" width="416" height="90" rx="4" fill="white"/>
  <text x="24" y="134" fill="#3e3e3c" font-size="10" font-weight="600" font-family="Arial,sans-serif">Pass Rate Trend</text>
  <!-- Y-axis lines -->
  <line x1="42" y1="142" x2="42" y2="196" stroke="#e4e2e2" stroke-width="1"/>
  <line x1="42" y1="196" x2="410" y2="196" stroke="#e4e2e2" stroke-width="1"/>
  <text x="38" y="146" fill="#706e6b" font-size="7" font-family="Arial,sans-serif" text-anchor="end">100%</text>
  <text x="38" y="170" fill="#706e6b" font-size="7" font-family="Arial,sans-serif" text-anchor="end">50%</text>
  <text x="38" y="196" fill="#706e6b" font-size="7" font-family="Arial,sans-serif" text-anchor="end">0%</text>
  <!-- Bars -->
  <rect x="46" y="158" width="14" height="38" fill="#3ba755" rx="1"/>
  <rect x="64" y="150" width="14" height="46" fill="#3ba755" rx="1"/>
  <rect x="82" y="155" width="14" height="41" fill="#3ba755" rx="1"/>
  <rect x="100" y="163" width="14" height="33" fill="#ff9800" rx="1"/>
  <rect x="118" y="148" width="14" height="48" fill="#3ba755" rx="1"/>
  <rect x="136" y="154" width="14" height="42" fill="#3ba755" rx="1"/>
  <rect x="154" y="162" width="14" height="34" fill="#ff9800" rx="1"/>
  <rect x="172" y="143" width="14" height="53" fill="#3ba755" rx="1"/>
  <rect x="190" y="170" width="14" height="26" fill="#f44336" rx="1"/>
  <rect x="208" y="149" width="14" height="47" fill="#3ba755" rx="1"/>
  <rect x="226" y="145" width="14" height="51" fill="#3ba755" rx="1"/>
  <rect x="244" y="153" width="14" height="43" fill="#3ba755" rx="1"/>
  <rect x="262" y="147" width="14" height="49" fill="#3ba755" rx="1"/>
  <rect x="280" y="143" width="14" height="53" fill="#3ba755" rx="1"/>
  <rect x="298" y="152" width="14" height="44" fill="#3ba755" rx="1"/>
  <rect x="316" y="148" width="14" height="48" fill="#3ba755" rx="1"/>
  <rect x="334" y="142" width="14" height="54" fill="#3ba755" rx="1"/>
  <rect x="352" y="146" width="14" height="50" fill="#3ba755" rx="1"/>
  <rect x="370" y="143" width="14" height="53" fill="#3ba755" rx="1"/>
  <rect x="388" y="142" width="14" height="54" fill="#3ba755" rx="1"/>
</svg>

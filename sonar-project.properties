# SonarQube project configuration for opsera-stuck-pipeline-detection
# Reference: https://docs.sonarqube.org/latest/project-administration/narrowing-the-focus/
#
# NOTE: SONARQUBE_TOKEN is stored as a pipeline secret in the Forge Shipping Engine.
# It must never be committed to this file or any version-controlled file.

# ── Project identification ─────────────────────────────────────────────────────
sonar.projectKey=opsera-stuck-pipeline-detection
sonar.projectName=Opsera Stuck Pipeline Detection
sonar.projectVersion=1.0

# ── Source directories ─────────────────────────────────────────────────────────
# Backend TypeScript packages and services
sonar.sources=\
  packages/shared/src,\
  services/api-gateway/src,\
  services/alert-service/src,\
  services/baseline-service/src,\
  services/dashboard-service/src,\
  services/detection-service/src,\
  packages/client/src

# ── Test directories ───────────────────────────────────────────────────────────
sonar.tests=\
  packages/shared/src,\
  services/api-gateway/src,\
  services/alert-service/src,\
  services/baseline-service/src,\
  services/dashboard-service/src,\
  services/detection-service/src,\
  packages/client/src

sonar.test.inclusions=\
  **/__tests__/**/*.ts,\
  **/__tests__/**/*.tsx,\
  **/*.test.ts,\
  **/*.test.tsx

# ── Exclusions ─────────────────────────────────────────────────────────────────
# Exclude test files from production code analysis; exclude generated/vendor code
sonar.exclusions=\
  **/__tests__/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/test-utils.ts,\
  **/test/setup.ts,\
  test/**,\
  node_modules/**,\
  dist/**,\
  build/**,\
  packages/client/src/test/**,\
  packages/shared/prisma/**

# ── TypeScript configuration ────────────────────────────────────────────────────
sonar.typescript.tsconfigPath=tsconfig.base.json

# ── Coverage reports ────────────────────────────────────────────────────────────
# Jest (backend) generates lcov.info in coverage/ subdirectory per package.
# Run with: npm run test -- --coverage --coverageReporters=lcov
# Vitest (frontend) generates lcov.info with: vitest run --coverage --reporter=lcov
sonar.javascript.lcov.reportPaths=\
  packages/shared/coverage/lcov.info,\
  services/api-gateway/coverage/lcov.info,\
  services/alert-service/coverage/lcov.info,\
  services/baseline-service/coverage/lcov.info,\
  services/dashboard-service/coverage/lcov.info,\
  services/detection-service/coverage/lcov.info,\
  packages/client/coverage/lcov.info

# ── Quality gate (enforced in SonarQube project configuration) ─────────────────
# The following thresholds are configured on the SonarQube server and referenced
# here for transparency. Changing this file does NOT change the quality gate —
# update the gate configuration in the SonarQube dashboard.
#
# Required passing conditions:
#   coverage:            >= 80% line coverage (new code and overall)
#   duplicated_lines:    <= 3%
#   cognitive_complexity: <= 15 per function
#   maintainability_rating: A
#   reliability_rating:     A
#   security_rating:        A
#   security_hotspots_reviewed: 100%
#   blocker_violations:  0
#   critical_violations: 0

# ── Source encoding ─────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── Links ───────────────────────────────────────────────────────────────────────
sonar.links.homepage=https://github.com/opsera/opsera-stuck-pipeline-detection
sonar.links.ci=https://forge.opsera.io/pipelines/opsera-stuck-pipeline-detection
sonar.links.issue=https://jira.opsera.io/projects/SPDETECT
